[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-tutorial-builder"
version = "0.3.0"
description = "Convert working code into step-by-step lessons with explanations and runnable examples"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "jinja2>=3.0",
]

[project.optional-dependencies]
multilang = [
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.23",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
    "mypy>=1.8",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.23",
]

[project.scripts]
code-tutorial-builder = "code_tutorial_builder.__main__:main"

[tool.setuptools.packages.find]
include = ["code_tutorial_builder*"]

[tool.setuptools.package-data]
code_tutorial_builder = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["code_tutorial_builder", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
# E501 (line length) is left to judgement rather than enforced in CI.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Language modules are imported purely to trigger registration side effects.
"code_tutorial_builder/languages/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.run]
source = ["code_tutorial_builder"]
branch = true

[tool.coverage.report]
show_missing = true
